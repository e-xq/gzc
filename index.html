<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超燃竞技场回放查看器</title>
<link rel="icon" type="image/webp" href="https://e-xq.github.io/right_icon_6f50e56a_inverted.webp">
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Google+Sans+Display:wght@400;500;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pako/2.1.0/pako.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/msgpack-lite/0.1.26/msgpack.min.js"></script>
<style>
  @font-face{font-family:'U5Font';src:url('https://e-xq.github.io/U5Font_Round_7744b500.woff2') format('woff2');font-weight:normal;font-style:normal;font-display:swap}
  :root{
    --primary:#415F91;--on-primary:#fff;--primary-container:#D6E3FF;--on-primary-container:#001B3F;
    --secondary:#565E71;--on-secondary:#fff;--secondary-container:#D9E2F9;--on-secondary-container:#131C2E;
    --tertiary:#705575;--tertiary-container:#FAD8FD;--on-tertiary:#fff;--on-tertiary-container:#29132F;
    --surface:#F9F9FF;--on-surface:#191C20;--on-surface-variant:#44474E;--surface-variant:#E0E2EC;
    --outline:#74777F;--outline-variant:#C4C6D0;
    --surface-low:#F2F2F9;--surface-container:#E3E2E9;--surface-lowest:#FFFFFF;--surface-container-low:#F4F3FA;--surface-container-high:#DDDCE4;--surface-container-highest:#D7D8E0;
    --error:#BA1A1A;--on-error:#fff;--error-container:#FFDAD6;--on-error-container:#410002;
    --camp1:#005AC8;--camp2:#C82828;--camp3:#967800;--camp4:#148C14;
    --r-xl:28px;--r-lg:16px;--r-md:12px;--r-sm:8px;
  }
  [data-theme="dark"]{
    --primary:#AAC7FF;--primary-container:#284777;--on-primary:#001B3F;--on-primary-container:#D6E3FF;
    --secondary:#BDC7DC;--secondary-container:#3E4759;--on-secondary:#131C2E;--on-secondary-container:#D9E2F9;
    --tertiary:#DDBCE0;--tertiary-container:#573D5C;--on-tertiary:#29132F;--on-tertiary-container:#FAD8FD;
    --surface:#111318;--on-surface:#E2E2E9;--on-surface-variant:#C3C6CF;--surface-variant:#44474E;
    --outline:#8E9099;--outline-variant:#44474E;
    --surface-low:#16181D;--surface-container:#1D2024;--surface-lowest:#0C0D11;--surface-container-low:#1A1C21;--surface-container-high:#272A2F;--surface-container-highest:#323439;
    --error:#FFB4AB;--on-error:#690005;--error-container:#93000A;--on-error-container:#FFDAD6;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:'U5Font','Google Sans','Noto Sans SC',sans-serif;background:var(--surface);color:var(--on-surface);display:flex;flex-direction:column;-webkit-font-smoothing:antialiased}

  /* Top bar */
  .top-app-bar{background:var(--surface-low);padding:0 20px;height:64px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--outline-variant);flex-shrink:0}
  .app-icon{width:40px;height:40px;background:var(--primary-container);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:22px;flex-shrink:0}
  .app-title{font-family:'U5Font','Google Sans Display','Noto Sans SC',sans-serif;font-size:20px;font-weight:500;flex:1}
  .top-btn{display:flex;align-items:center;gap:6px;padding:8px 16px;background:var(--primary-container);color:var(--on-primary-container);border:none;border-radius:100px;font-size:13px;font-weight:500;font-family:inherit;cursor:pointer;text-decoration:none;transition:filter .15s;flex-shrink:0}
  .top-btn:hover{filter:brightness(.95)}
  .top-btn .material-icons-round{font-size:16px}

  /* Drop zone */
  #drop-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:48px;text-align:center;transition:background .25s ease;background:var(--surface)}
  #drop-zone.drag-over{background:color-mix(in srgb,var(--primary-container) 60%,var(--surface))}
  .drop-icon{width:80px;height:80px;background:var(--primary-container);border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:36px;animation:pulse 2s ease-in-out infinite;flex-shrink:0;transition:background .25s ease,color .25s ease}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
  .drop-title{font-size:18px;font-weight:500}
  .drop-sub{font-size:14px;color:var(--on-surface-variant)}
  .btn-filled{display:flex;align-items:center;gap:6px;padding:10px 24px;background:var(--primary);color:var(--on-primary);border:none;border-radius:100px;font-size:14px;font-weight:500;font-family:inherit;cursor:pointer;transition:filter .15s}
  .btn-filled:hover{filter:brightness(1.08)}
  .btn-filled .material-icons-round{font-size:18px}
  #file-input{display:none}

  /* Main layout */
  #main-view{flex:1;min-height:0;display:none;overflow:hidden}
  #main-view.visible{display:flex}

  /* Left: player list */
  #left-panel{width:300px;flex-shrink:0;border-right:1px solid var(--outline-variant);display:flex;flex-direction:column;overflow:hidden;background:var(--surface-low)}
  .panel-header{padding:12px 16px;font-size:12px;font-weight:700;color:var(--on-surface-variant);letter-spacing:.6px;text-transform:uppercase;border-bottom:1px solid var(--outline-variant);flex-shrink:0}
  #player-list{flex:1;overflow-y:auto}
  .team-header{padding:8px 16px 4px;font-size:12px;font-weight:700;letter-spacing:.4px}
  .team-header.camp1{color:var(--camp1)}
  .team-header.camp2{color:var(--camp2)}
  .team-header.camp3{color:var(--camp3)}
  .team-header.camp4{color:var(--camp4)}
  .player-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;transition:background .1s;border-bottom:1px solid var(--surface-container)}
  .player-item:hover{background:var(--surface-container)}
  .player-item.selected{background:var(--primary-container)}
  .player-avatar{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:#fff;flex-shrink:0;overflow:hidden}
  .player-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .player-info{flex:1;min-width:0}
  .player-nick{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .player-meta{font-size:11px;color:var(--on-surface-variant);margin-top:1px}
  .ai-badge{font-size:10px;background:var(--surface-container);color:var(--on-surface-variant);padding:1px 6px;border-radius:100px;margin-left:4px}

  /* Right: detail */
  #right-panel{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden;min-height:0;position:relative}
  #empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--on-surface-variant)}
  #empty-state .material-icons-round{font-size:48px;opacity:.3}
  #empty-state p{font-size:14px}
  #detail-view{position:absolute;inset:0;overflow-y:auto;padding:20px;display:none}
  #detail-view.visible{display:block}
  #detail-view>*{margin-bottom:16px}
  #detail-view>*:last-child{margin-bottom:0}

  /* Summary card */
  .summary-card{background:var(--surface-lowest);border:1px solid var(--outline-variant);border-radius:var(--r-lg);padding:20px;display:flex;gap:16px;align-items:flex-start;flex-shrink:0}
  .summary-avatar{width:72px;height:72px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;overflow:hidden}
  .summary-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  .summary-info{flex:1;min-width:0}
  .summary-nick{font-size:20px;font-weight:700;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .summary-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .chip{display:flex;align-items:center;gap:4px;padding:3px 10px;border-radius:100px;font-size:12px;font-weight:500}
  .chip.camp1{background:#E8F0FF;color:var(--camp1)}
  .chip.camp2{background:#FFE8E8;color:var(--camp2)}
  .chip.camp3{background:#FFF5D0;color:var(--camp3)}
  .chip.camp4{background:#E8FFE8;color:var(--camp4)}
  .chip.neutral{background:var(--surface-container);color:var(--on-surface-variant)}
  .chip .material-icons-round{font-size:14px}
  .summary-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
  .summary-field{background:var(--surface-container);border-radius:var(--r-sm);padding:8px 12px;min-width:0}
  .summary-field-label{font-size:11px;color:var(--on-surface-variant);margin-bottom:2px}
  .summary-field-value{font-size:13px;font-weight:500;word-break:break-all;line-height:1.4}

  /* Section cards */
  .section-card{background:var(--surface-lowest);border:1px solid var(--outline-variant);border-radius:var(--r-lg)}
  .section-card .kv-row:last-child,.section-card>div:last-child{border-bottom:none}
  .section-title{padding:12px 16px;font-size:13px;font-weight:700;color:var(--primary);border-bottom:1px solid var(--outline-variant);background:var(--surface-low);border-radius:var(--r-lg) var(--r-lg) 0 0;display:flex;align-items:center;min-height:40px}
  .kv-row{display:flex;align-items:center;padding:8px 16px;border-bottom:1px solid var(--surface-container);font-size:13px;transition:background .1s;gap:24px}
  .kv-row:last-child{border-bottom:none}
  .kv-row:hover{background:color-mix(in srgb,var(--primary-container) 50%,transparent) !important}
  .section-card .kv-row:last-child:hover{border-radius:0 0 var(--r-lg) var(--r-lg)}
  .kv-key{color:var(--on-surface-variant);font-size:12px;width:220px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .kv-val{flex:1;min-width:0;word-break:break-all;line-height:1.6}



  /* Status bar */
  .status-bar{background:var(--surface-low);border-top:1px solid var(--outline-variant);padding:6px 20px;font-size:12px;color:var(--on-surface-variant);flex-shrink:0}

  /* Snackbar */
  #snackbar{position:fixed;bottom:24px;left:50%;background:var(--surface-container-highest);color:var(--on-surface);padding:12px 20px;border-radius:12px;font-size:14px;z-index:500;pointer-events:none;display:flex;align-items:flex-start;gap:8px;box-shadow:0 4px 16px rgba(0,0,0,.28);opacity:0;visibility:hidden;transform:translateX(-50%) translateY(80px);max-width:90vw;white-space:normal;word-break:break-all;text-align:left}
  #snackbar.show{visibility:visible;animation:snackIn .35s cubic-bezier(.34,1.56,.64,1) forwards}
  #snackbar.hide{visibility:visible;animation:snackOut .3s ease-in forwards}
  @keyframes snackIn{from{transform:translateX(-50%) translateY(80px);opacity:0}to{transform:translateX(-50%) translateY(0);opacity:1}}
  @keyframes snackOut{from{transform:translateX(-50%) translateY(0);opacity:1}to{transform:translateX(-50%) translateY(80px);opacity:0}}
  #snackbar .material-icons-round{font-size:18px;color:#A8C7FA}

  @media(max-width:600px){
    #left-panel{
      position:fixed;top:0;left:0;bottom:0;width:84vw;max-width:300px;z-index:201;
      display:flex;background:var(--surface-low);overflow-y:auto;flex-direction:column;
      transform:translateX(-100%);
      border-radius:0 var(--r-xl) var(--r-xl) 0;transition:transform .26s cubic-bezier(.4,0,.2,1);will-change:transform;
    }
    #left-panel.mobile-open{transform:translateX(0)}
    #right-panel{width:100%;position:relative;flex:1;min-width:0}
    .summary-card{flex-direction:column}
    .kv-row{flex-direction:column;gap:4px;align-items:flex-start;padding:10px 16px}
    .kv-key{width:100%;font-size:11px}
    .kv-val{width:100%;text-align:left;font-size:14px}
    #empty-state p{font-size:13px;text-align:center;padding:0 24px}
    .player-nick{font-size:16px}
    .player-meta{font-size:13px}
    .player-item{padding:12px 16px}
    .player-avatar{width:40px;height:40px;font-size:18px}
    .team-header{font-size:14px;padding:12px 16px 6px}
    .panel-header{font-size:14px;padding:14px 16px;min-height:56px}
    #snackbar{font-size:14px;bottom:16px;max-width:80vw;left:10vw;transform:translateY(80px);width:80vw}
    #snackbar.show{animation:snackInM .35s cubic-bezier(.34,1.56,.64,1) forwards}
    #snackbar.hide{animation:snackOutM .3s ease-in forwards}
    @keyframes snackInM{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}
    @keyframes snackOutM{from{transform:translateY(0);opacity:1}to{transform:translateY(80px);opacity:0}}
  }
  #mobile-overlay{position:fixed;inset:0;z-index:200;opacity:0;visibility:hidden;pointer-events:none}
  .top-app-bar,#right-panel,.status-bar{transition:filter .26s ease}
  body.panel-open .top-app-bar,body.panel-open #right-panel,body.panel-open .status-bar,
  body.panel-drag .top-app-bar,body.panel-drag #right-panel,body.panel-drag .status-bar{filter:blur(var(--panel-blur,2px))}
  body.panel-open #right-panel,body.panel-drag #right-panel{pointer-events:none}
  body.panel-drag .top-app-bar,body.panel-drag #right-panel,body.panel-drag .status-bar{transition:none}
  #menu-btn{display:none}
  @media(max-width:600px){#menu-btn.visible{display:flex}}
  
</style>
</head>
<body>

<header class="top-app-bar">
  <button class="top-btn" id="menu-btn" onclick="openMobilePanel()" title="玩家列表" style="width:40px;height:40px;padding:0;justify-content:center;border-radius:50%;background:none;color:var(--on-surface-variant)">
    <span class="material-icons-round" style="font-size:20px">menu</span>
  </button>
  <div class="app-icon"><span class="material-icons-round">sports_esports</span></div>
  <div class="app-title">超燃竞技场回放查看器</div>
  <button class="top-btn" id="theme-btn" onclick="toggleTheme()" title="切换主题" style="width:40px;height:40px;padding:0;justify-content:center;border-radius:50%">
    <span class="material-icons-round" id="theme-icon" style="font-size:20px">dark_mode</span>

<!-- Drop zone -->
<div id="drop-zone">
  <div class="drop-icon"><span class="material-icons-round">upload_file</span></div>
  <div class="drop-title">打开文件以查看战斗录像信息</div>
  <div class="drop-sub">拖动文件上传或点击选择文件</div>
  <button class="btn-filled" onclick="document.getElementById('file-input').click()">
    <span class="material-icons-round">folder_open</span>选择文件
  </button>
  <input type="file" id="file-input" accept=".av2">
</div>

<!-- Main view -->
<div id="main-view">
  <div id="left-panel">
    <div class="panel-header" style="display:flex;align-items:center;justify-content:space-between">
      <span>玩家列表</span>
      <div style="display:flex;align-items:center;gap:4px">
        <button onclick="document.getElementById('file-input2').click()" style="background:none;border:none;cursor:pointer;color:var(--primary);display:flex;align-items:center;gap:4px;font-size:12px;font-family:inherit;padding:2px 4px;border-radius:6px" title="上传新文件">
          <span class="material-icons-round" style="font-size:16px">upload_file</span>上传文件
        </button>
        <button id="mobile-close-btn" onclick="closeMobilePanel()" style="display:none;background:none;border:none;cursor:pointer;color:var(--on-surface-variant);padding:4px;border-radius:50%">
          <span class="material-icons-round" style="font-size:20px">close</span>
        </button>
      </div>
      <input type="file" id="file-input2" accept=".av2" style="display:none">
    </div>
    <div id="player-list"></div>
  </div>
  <div id="right-panel">
    <div id="empty-state">
      <span class="material-icons-round">person_search</span>
      <p>点击左侧玩家查看详细信息</p>
    </div>
    <div id="detail-view"></div>
  </div>
</div>

<div id="mobile-overlay" onclick="closeMobilePanel()"></div>

<div class="status-bar" id="status-bar">等待加载文件...</div>
<div id="snackbar"><span class="material-icons-round">check_circle</span><span id="snackbar-text"></span></div>

// ── Helpers ──
function cn(key){return KEY_CN[String(key)]||String(key)}
function escHtml(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function scalar(key,v){
  if(BOOL_KEYS.has(key))return BOOL_MAP[v]??String(v);
  if(key==="gender")return GENDER_MAP[v]??String(v);
  if(key==="camp_id")return CAMP_MAP[v]??`阵营${v}`;
  if(key==="zodiac_sign")return v?ZODIAC_MAP[v]??v:"未设置";
  if(key==="avatar_img_type_in_use")return({1:"游戏内头像",2:"自定义上传"})[v]??String(v);
  if(key==="privilege_type")return({0:"普通",1:"认证用户",2:"官方"})[v]??String(v);
  if(key==="skin_color_id")return({1:"默认肤色"})[v]??String(v);
  if(key==="cur_fashion_game_type")return({1:"蛋仔形时装",2:"人形时装"})[v]??String(v);
  if(key==="cur_human_type")return({1:"蛋仔形",2:"人形"})[v]??String(v);
  if(typeof v==="boolean")return BOOL_MAP[v]??String(v);
  return String(v);
}
function fmtBirthday(b){
  if(typeof b!=="object"||!b)return String(b);
  const m=b.month??-1,d=b.day??-1;
  const z=ZODIAC_MAP[b.zodiac_sign||""]||b.zodiac_sign||"";
  if(m===-1||d===-1)return"未设置";
  return`${m}月${d}日 ${z}`.trim();
}

// ── Decode ──
function decode(obj){
  if(obj instanceof Uint8Array){try{return new TextDecoder().decode(obj)}catch{return Array.from(obj).map(b=>b.toString(16).padStart(2,"0")).join("")}}
  if(Array.isArray(obj))return obj.map(decode);
  if(obj&&typeof obj==="object"&&!(obj instanceof Uint8Array)){const r={};for(const[k,v]of Object.entries(obj))r[decode(k)]=decode(v);return r}
  return obj;
}

// ── File parsing ──
async function parseFile(buf){
  let raw=new Uint8Array(buf);
  // zlib detect
  if(raw.length>=2&&raw[0]===0x78&&[0x01,0x9C,0xDA,0x5E].includes(raw[1])){
    raw=pako.inflate(raw);
  }
  // msgpack
  let data;
  try{
    data=msgpack.decode(raw);
    if(data&&typeof data==="object"&&!Array.isArray(data)){return decode(data)}
  }catch(e){}
  // stream mode
  const codec=msgpack.createCodec({preset:true});
  let offset=0;
  while(offset<raw.length){
    try{
      const result=msgpack.decode(raw.slice(offset),{codec});
      const decoded=decode(result);
      if(decoded&&typeof decoded==="object"&&!Array.isArray(decoded)){
        const keys=Object.keys(decoded);
        if(keys.length>2)return decoded;
      }
      offset+=1;
    }catch(e){offset+=1}
  }
  throw new Error("未能解析文件，请确认文件来自超燃竞技场战斗录像");
}

function extractHeroes(data){
  const start=data.start_info||data;
  return start.heroes||{};
}

// ── Avatar colors ──
const PALETTE=["#005AC8","#C82828","#967800","#148C14","#821496","#148296"];
function avatarColor(uid){return PALETTE[Math.abs([...String(uid)].reduce((a,c)=>a+c.charCodeAt(0),0))%PALETTE.length]}

function avatarEl(nick,uid,url,size=32){
  const wrap=document.createElement("div");
  wrap.className="player-avatar";
  wrap.style.cssText=`width:${size}px;height:${size}px;font-size:${Math.round(size*0.4)}px`;
  if(url&&url.startsWith("http")){
    const img=document.createElement("img");
    img.src=url;img.alt=nick;
    img.onerror=()=>{wrap.removeChild(img);wrap.style.background=avatarColor(uid);wrap.textContent=(nick||"?")[0]};
    wrap.appendChild(img);
  }else{
    wrap.style.background=avatarColor(uid);
    wrap.textContent=(nick||"?")[0];
  }
  return wrap;
}

// ── Render player list ──
function renderList(){
  const list=document.getElementById("player-list");
  list.innerHTML="";
  const teams={};
  for(const[aid,info]of Object.entries(heroes)){
    const tid=info.team_id??"unknown";
    if(!teams[tid])teams[tid]=[];
    teams[tid].push([aid,info]);
  }
  const sorted=Object.entries(teams).sort(([,a],[,b])=>(a[0]?.[1]?.camp_id??99)-(b[0]?.[1]?.camp_id??99));
  for(const[,players]of sorted){
    const campId=players[0]?.[1]?.camp_id;
    const campClass=CAMP_CLASS[campId]||"";
    const hdr=document.createElement("div");
    hdr.className=`team-header ${campClass}`;
    hdr.textContent=CAMP_MAP[campId]||"未知队伍";
    list.appendChild(hdr);
    for(const[aid,info]of players){
      const item=document.createElement("div");
      item.className="player-item"+(aid===currentAid?" selected":"");
      item.dataset.aid=aid;
      const av=avatarEl(info.nickname||aid,aid,info.avatar_img_url,32);
      const pi=document.createElement("div");pi.className="player-info";
      const pn=document.createElement("div");pn.className="player-nick";
      pn.textContent=info.nickname||aid;
      if(info.is_ai)pn.innerHTML+=`<span class="ai-badge">AI</span>`;
      const pm=document.createElement("div");pm.className="player-meta";
      pm.textContent=`Lv.${info.level??"?"} · MMR ${info.mmr!=null?info.mmr:"—"}`;
      pi.appendChild(pn);pi.appendChild(pm);
      item.appendChild(av);item.appendChild(pi);
      item.onclick=()=>selectPlayer(aid);
      list.appendChild(item);
    }
  }
}

// ── Select player ──
function selectPlayer(aid){
  currentAid=aid;
  document.querySelectorAll(".player-item").forEach(el=>el.classList.toggle("selected",el.dataset.aid===aid));
  document.getElementById("empty-state").style.display="none";
  const dv=document.getElementById("detail-view");
  dv.classList.add("visible");
  dv.innerHTML="";
  if(isMobile()){
    renderSummary(aid,heroes[aid]);
    closeMobilePanel();
    renderSections(aid,heroes[aid]);
  }else{
    renderDetail(aid,heroes[aid]);
  }
}

function buildSummaryCard(aid,info){
  const card=document.createElement("div");card.className="summary-card";
  const campId=info.camp_id;
  const campClass=CAMP_CLASS[campId]||"neutral";
  const av=avatarEl(info.nickname||aid,aid,info.avatar_img_url,72);
  av.className="summary-avatar";
  card.appendChild(av);
  const si=document.createElement("div");si.className="summary-info";
  const sn=document.createElement("div");sn.className="summary-nick";sn.textContent=info.nickname||aid;
  si.appendChild(sn);
  const chips=document.createElement("div");chips.className="summary-chips";
  const addChip=(txt,cls,icon)=>{const c=document.createElement("div");c.className=`chip ${cls}`;if(icon)c.innerHTML=`<span class="material-icons-round">${icon}</span>`;c.innerHTML+=escHtml(txt);chips.appendChild(c)};
  if(campId)addChip(CAMP_MAP[campId]||`阵营${campId}`,campClass,"group");
  if(info.is_ai)addChip("AI托管","neutral","smart_toy");
  if(info.official_account)addChip("官方账号","neutral","verified");
  si.appendChild(chips);
  const grid=document.createElement("div");grid.className="summary-grid";
  const fields=[["数字UID",info.nid||"—"],["账号等级",info.level?`Lv.${info.level}`:"—"],["展示MMR",info.mmr!=null?info.mmr:"—"],["真实MMR",info.real_mmr!=null?info.real_mmr:"—"],["超燃蛋仔ID",info.moba_hero!=null?info.moba_hero:"—"],["设备型号",info.device_model||"—"]];

    const f=document.createElement("div");f.className="summary-field";
    f.innerHTML=`<div class="summary-field-label">${escHtml(label)}</div><div class="summary-field-value">${escHtml(String(val))}</div>`;
    grid.appendChild(f);
  });
  si.appendChild(grid);
  card.appendChild(si);
  return card;
}

function renderSummary(aid,info){
  const dv=document.getElementById("detail-view");
  dv.appendChild(buildSummaryCard(aid,info));
}

function renderSections(aid,info){
  const dv=document.getElementById("detail-view");
  const knownKeys=new Set(SECTIONS.slice(0,-1).flatMap(([,k])=>k||[]));
  const sections=[];
  for(const[secTitle,keys]of SECTIONS){
    let entries;
    if(keys===null){
      entries=Object.entries(info).filter(([k])=>!knownKeys.has(k)&&!k.startsWith("abtest"));
    }else{
      entries=keys.filter(k=>Object.prototype.hasOwnProperty.call(info,k)).map(k=>[k,info[k]]);
    }
    if(entries.length)sections.push([secTitle,entries]);
  }
  function renderNext(i){
    if(i>=sections.length)return;
    const[secTitle,entries]=sections[i];
    const sc=document.createElement("div");sc.className="section-card";
    const st=document.createElement("div");st.className="section-title";st.textContent=secTitle;
    sc.appendChild(st);
    for(const[k,v]of entries){
      if(k==="qualify_level")continue;
      renderKV(sc,k,v,false);
    }
    dv.appendChild(sc);
    const next=()=>renderNext(i+1);
    if(typeof requestIdleCallback!=="undefined")requestIdleCallback(next,{timeout:100});
    else setTimeout(next,0);
  }
  renderNext(0);
}

function renderDetail(aid,info){
  const dv=document.getElementById("detail-view");
  dv.innerHTML="";
  renderSummary(aid,info);
  renderSections(aid,info);
}

function renderKV(parent,key,val,grey){
  if(key==="battle_birthday_info"){
    appendKVRow(parent,cn(key),fmtBirthday(val),grey);return;
  }
  if(val===null||val===undefined){
    appendKVRow(parent,cn(key),"—",grey);return;
  }
  if(val&&typeof val==="object"&&!Array.isArray(val)){
    if(Object.keys(val).length===0){appendKVRow(parent,cn(key),"无",grey);return}
    appendNestedHeader(parent,cn(key));
    for(const[k,v]of Object.entries(val))renderKV(parent,k,v,true);
    return;
  }
  if(Array.isArray(val)){
    if(val.length===0){appendKVRow(parent,cn(key),"无",grey);return}
    if(val.every(i=>i===null||typeof i!=="object")){appendKVRow(parent,cn(key),"["+val.join(",  ")+"]",grey);return}
    appendNestedHeader(parent,cn(key));
    val.forEach((item,i)=>renderKV(parent,String(i),item,true));
    return;
  }
  appendKVRow(parent,cn(key),scalar(key,val),grey);
}

function appendKVRow(parent,key,val,grey){
  const row=document.createElement("div");
  row.className="kv-row";
  if(grey)row.style.background="var(--surface-container)";
  row.innerHTML=`<div class="kv-key">${escHtml(key)}</div><div class="kv-val">${escHtml(String(val))}</div>`;
  parent.appendChild(row);
}

function appendNestedHeader(parent,label){
  const row=document.createElement("div");
  row.style.cssText="background:var(--surface-container);border-top:1px solid var(--outline-variant);border-bottom:1px solid var(--outline-variant);padding:0 16px;font-weight:700;font-size:14px;color:var(--on-surface);display:flex;align-items:center;min-height:40px;transition:background .1s;cursor:default";
  row.onmouseenter=()=>row.style.background="color-mix(in srgb,var(--primary-container) 50%,var(--surface-container))";
  row.onmouseleave=()=>row.style.background="var(--surface-container)";
  row.textContent=label;
  parent.appendChild(row);
}



// ── File load ──
function _checkAv2(file){
  if(!file)return "未选择文件";
  if(!file.name.toLowerCase().endsWith(".av2"))return "仅支持 .av2 文件";
  if(file.size>2*1024*1024)return "文件超过 2MB 大小限制";
  return null;
}
async function loadFile(file){
  const err=_checkAv2(file);
  if(err){showSnack(err,true);return;}
  document.getElementById("status-bar").textContent=`正在解析 ${file.name}...`;
  try{
    const buf=await file.arrayBuffer();
    const data=await parseFile(buf);
    heroes=extractHeroes(data);
    if(!Object.keys(heroes).length)throw new Error("未能读取到玩家数据，请确认文件来自超燃竞技场战斗录像");
    currentAid=null;
    document.getElementById("drop-zone").style.display="none";
    dropIcon.style.background="";
    dropIcon.style.color="";
    document.getElementById("main-view").classList.add("visible");
    document.getElementById("menu-btn").classList.add("visible");
    document.getElementById("empty-state").style.display="flex";
    document.getElementById("detail-view").classList.remove("visible");
    document.getElementById("detail-view").innerHTML="";
    renderList();
    const teams=new Set(Object.values(heroes).map(h=>h.team_id));
    document.getElementById("status-bar").textContent=`已加载：${file.name} · ${Object.keys(heroes).length} 名玩家 · ${teams.size} 支队伍`;
  }catch(e){
    showError(e.message);
    document.getElementById("status-bar").textContent="解析失败";
  }
}

function showError(msg){
  if(msg)showSnack(msg,true);
}

// panel state
let _panelOpen=false;
let _animRaf=null;

function _easeInOut(t){return t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2}

function _animatePanel(fromRatio,toRatio,duration,onDone){
  if(_animRaf)cancelAnimationFrame(_animRaf);
  const p=document.getElementById("left-panel");
  const ov=document.getElementById("mobile-overlay");
  const W=p.offsetWidth||window.innerWidth;
  p.style.transition="none";
  ov.style.transition="none";
  ov.style.visibility="visible";
  document.body.classList.add("panel-drag");
  const start=performance.now();
  function frame(now){
    const t=Math.min(1,(now-start)/duration);
    const e=_easeInOut(t);
    const ratio=fromRatio+(toRatio-fromRatio)*e;
    const tx=(ratio-1)*W;
    p.style.transform="translateX("+tx+"px)";
    ov.style.opacity=ratio*0.42;
    ov.style.pointerEvents=ratio>0.5?"all":"none";
    _setPanelBlur(ratio*2);
    if(t<1){_animRaf=requestAnimationFrame(frame);}
    else{
      _animRaf=null;_clearPanelDrag();
      p.style.transition="";ov.style.transition="";
      if(toRatio===1)p.style.transform="";
      if(onDone)onDone();
    }
  }
  _animRaf=requestAnimationFrame(frame);
}

function _getCurrentRatio(){
  const p=document.getElementById("left-panel");
  const tx=new DOMMatrix(getComputedStyle(p).transform).m41;
  const W=p.offsetWidth||window.innerWidth;
  return Math.max(0,Math.min(1,(tx+W)/W));
}
function _setPanelBlur(px){document.documentElement.style.setProperty("--panel-blur",px+"px")}
function _clearPanelDrag(){
  document.body.classList.remove("panel-drag");
  document.documentElement.style.removeProperty("--panel-blur");
}

function _commitPanel(open){
  if(_animRaf)cancelAnimationFrame(_animRaf);
  _panelOpen=open;
  const p=document.getElementById("left-panel");
  const ov=document.getElementById("mobile-overlay");
  const btn=document.getElementById("mobile-close-btn");
  const from=_getCurrentRatio();
  document.body.classList.toggle("panel-open",open);
  if(open){
    p.classList.add("mobile-open");
    btn.style.display="flex";
    document.body.style.overflow="hidden";
    _animatePanel(from,1,280,null);
  }else{
    p.classList.remove("mobile-open");
    document.body.style.overflow="";
    _animatePanel(from,0,280,()=>{
      if(!_panelOpen){
        p.style.transform="";
        ov.style.visibility="hidden";
        ov.style.opacity="0";
        ov.style.pointerEvents="none";
        btn.style.display="none";
      }
    });
  }
}

function openMobilePanel(){
  if(!isMobile())return;
  if(_animRaf)cancelAnimationFrame(_animRaf);
  _panelOpen=true;
  const p=document.getElementById("left-panel");
  const ov=document.getElementById("mobile-overlay");
  const btn=document.getElementById("mobile-close-btn");
  document.body.classList.add("panel-open");
  p.classList.add("mobile-open");
  btn.style.display="flex";
  document.body.style.overflow="hidden";
  // 面板常驻渲染，从当前位置继续动画
  const from=_getCurrentRatio();
  ov.style.visibility="visible";
  _animatePanel(from,1,280,null);
}
function closeMobilePanel(){
  if(!isMobile())return;
  _commitPanel(false);
}

// ── Touch drag ──
let _tx=0,_ty=0,_mode=null,_moved=false,_startRatio=0;

document.addEventListener("touchstart",e=>{
  if(!isMobile())return;
  // 只在主视图可见时才允许手势
  if(!document.getElementById("main-view").classList.contains("visible"))return;
  _tx=e.touches[0].clientX;
  _ty=e.touches[0].clientY;
  _moved=false;_mode=null;
  if(_panelOpen){
    _mode="close";_startRatio=1;
  }else{
    _mode="open";_startRatio=0;
  }
},{passive:true});

document.addEventListener("touchmove",e=>{
  if(!isMobile()||!_mode)return;
  const dx=e.touches[0].clientX-_tx;
  const dy=Math.abs(e.touches[0].clientY-_ty);
  if(!_moved){
    if(dy>Math.abs(dx)&&dy>12){_mode=null;return;}
    if(Math.abs(dx)<4)return;
    _moved=true;
    if(_animRaf)cancelAnimationFrame(_animRaf);
    const p=document.getElementById("left-panel");
    const ov=document.getElementById("mobile-overlay");
    document.getElementById("mobile-close-btn").style.display="flex";
    p.style.transition="none";
    ov.style.visibility="visible";
    ov.style.transition="none";
    document.body.classList.add("panel-drag");
    if(_mode==="open")p.style.transform="translateX(-100%)";
  }
  const W=document.getElementById("left-panel").offsetWidth||window.innerWidth;
  let ratio=_startRatio+dx/W;
  ratio=Math.max(0,Math.min(1,ratio));
  const p=document.getElementById("left-panel");
  const ov=document.getElementById("mobile-overlay");
  p.style.transform="translateX("+((ratio-1)*W)+"px)";
  _setPanelBlur(ratio*2);
  ov.style.opacity=ratio*0.42;
  ov.style.pointerEvents=ratio>0.5?"all":"none";
},{passive:true});

document.addEventListener("touchend",e=>{
  if(!isMobile()||!_mode){_mode=null;_moved=false;return;}
  if(!_moved){_mode=null;return;}
  const dx=e.changedTouches[0].clientX-_tx;
  const W=document.getElementById("left-panel").offsetWidth||window.innerWidth;
  const ratio=_startRatio+dx/W;
  if(_mode==="open")_commitPanel(ratio>0.3);
  else _commitPanel(ratio>0.6);
  _mode=null;_moved=false;
},{passive:true});
let snackTimer,hideTimer;
function showSnack(msg,isError=false){
  const el=document.getElementById("snackbar");
  document.getElementById("snackbar-text").textContent=msg;
  const icon=el.querySelector(".material-icons-round");
  if(isError){
    icon.textContent="error_outline";
    icon.style.color="#FFB3B3";
  }else{
    icon.textContent="check_circle";
    icon.style.color="#A8C7FA";
  }
  clearTimeout(snackTimer);clearTimeout(hideTimer);
  el.classList.remove("show","hide");el.style.visibility="visible";el.style.animation="none";
  void el.offsetWidth;el.style.animation="";el.classList.add("show");
  snackTimer=setTimeout(()=>{el.classList.remove("show");el.classList.add("hide");
    const done=()=>{el.classList.remove("hide");el.style.visibility="hidden"};
    el.addEventListener("animationend",done,{once:true});hideTimer=setTimeout(done,400);},2000);
}

// ── Events ──
document.getElementById("file-input").addEventListener("change",e=>{
  if(e.target.files[0])loadFile(e.target.files[0]);
  e.target.value="";
});
document.getElementById("file-input2").addEventListener("change",e=>{
  if(e.target.files[0])loadFile(e.target.files[0]);
  e.target.value="";
});
const dz=document.getElementById("drop-zone");
// 预热 color-mix 避免首次拖拽闪烁（不影响视觉）
const _warm=document.createElement("div");
_warm.style.cssText="position:fixed;opacity:0;pointer-events:none;background:color-mix(in srgb,var(--primary-container) 60%,var(--surface))";
document.body.appendChild(_warm);
requestAnimationFrame(()=>document.body.removeChild(_warm));

let dragCount=0,dragRaf=null;
const dropIcon=document.querySelector(".drop-icon");
function setDragOver(on){
  if(dragRaf)cancelAnimationFrame(dragRaf);
  dragRaf=requestAnimationFrame(()=>{
    dragRaf=null;
    if(dz.style.display==="none")return;
    if(on){
      dz.classList.add("drag-over");
      dropIcon.style.background="var(--primary)";
      dropIcon.style.color="var(--on-primary)";
    }else{
      dragCount=0;
      dz.classList.remove("drag-over");
      dropIcon.style.background="var(--primary-container)";
      dropIcon.style.color="var(--primary)";
    }
  });
}
dz.addEventListener("dragenter",e=>{e.preventDefault();dragCount++;setDragOver(true)});
dz.addEventListener("dragleave",e=>{dragCount=Math.max(0,dragCount-1);if(dragCount===0)setDragOver(false)});
dz.addEventListener("dragover",e=>{e.preventDefault()});
dz.addEventListener("drop",e=>{e.preventDefault();dragCount=0;setDragOver(false);if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])});
document.body.addEventListener("dragover",e=>e.preventDefault());
document.body.addEventListener("drop",e=>{e.preventDefault();dragCount=0;setDragOver(false);if(e.dataTransfer.files[0])loadFile(e.dataTransfer.files[0])});
document.addEventListener("dragleave",e=>{if(!e.relatedTarget){dragCount=0;setDragOver(false)}});
document.addEventListener("dragend",()=>{dragCount=0;setDragOver(false)});

// ── Theme ──
function toggleTheme(){
  const next=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",next);
  localStorage.setItem("theme",next);
  updateThemeIcon();
}
function updateThemeIcon(){
  const icon=document.getElementById("theme-icon");
  if(icon)icon.textContent=document.documentElement.getAttribute("data-theme")==="dark"?"light_mode":"dark_mode";
}
(()=>{
  const saved=localStorage.getItem("theme");
  const prefer=saved||(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light");
  document.documentElement.setAttribute("data-theme",prefer);
  updateThemeIcon();
})();
</script>
